<!DOCTYPE html>
<html>
<head>
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h2>My To-Do List</h2>

    <!-- Input box for task -->
    <input type="text" id="taskInput" placeholder="Enter a task">

    <!-- Add button -->
    <button onclick="addTask()">Add Task</button>

    <!-- Task list -->
    <ul id="taskList"></ul>
  </div>

<script src="script.js"></script>
</body>
</html>
